global_planner_node:
  ros__parameters:
    map_topic: "earth_rover/persistent_map"
    target_topic: "earth_rover/target_waypoint"
    global_path_topic: "earth_rover/global_path"
    global_planner_valid_topic: "earth_rover/global_planner_valid"
    map_frame: "map"
    base_frame: "base_link"
    from_ll_service: "/fromLL"
    replan_min_period_s: 2.0
    occupied_ref_value: 78          # Umbral de obstáculo: confianza 55 -> (55+100)/2 = 77.5 -> cuantizado en pasos de 5 a 80 (80 >= 78 -> costo infinito)
    free_ref_value: 40              # = confidence -20 en la escala graduada nueva: (-20+100)/2 = 40
    unknown_cell_cost: 2.5          # bajado desde 20.0 para evitar rodeos patológicos
    max_finite_cost: 15.0
    cost_change_epsilon: 0.75
    max_vertex_updates_per_cycle: 20000
    footprint_inflation_radius_m: 0.15 # Rover de 250mm de ancho -> 0.15m de radio de inflación
    goal_search_radius_m: 13.0      # alineado con goal_tolerance_m de navegación
    connectivity: 8
    tf_lookup_timeout_s: 0.2
