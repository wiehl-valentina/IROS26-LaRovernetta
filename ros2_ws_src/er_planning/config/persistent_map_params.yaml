persistent_map_node:
  ros__parameters:
    local_grid_topic: "earth_rover/local_bev_grid"
    map_topic: "earth_rover/persistent_map"
    map_frame: "map"
    map_width_m: 400.0
    map_height_m: 400.0
    map_resolution_m_per_px: 0.20
    # Origen del mapa en coordenadas del frame 'map' (esquina inferior
    # izquierda de la grilla). Con el robot arrancando ~cerca del centro
    # del área operativa, un valor negativo de la mitad del ancho/alto
    # centra el mapa en el origen del frame 'map' (que a su vez está
    # anclado al primer fix GPS por navsat_transform).
    map_origin_x_m: -200.0
    map_origin_y_m: -200.0
    hit_gain: 15.0
    miss_gain: 10.0
    confidence_max: 100.0
    hit_vote_threshold: 0.15
    unknown_evidence_band: 5.0
    publish_quantization_step: 5
    # Diagnóstico interno (ya no definen los valores de publicación en el OccupancyGrid)
    occupied_threshold: 55.0
    free_threshold: -20.0
    decay_period_s: 5.0
    decay_factor: 0.7738   # = 0.95^5, preserva la misma constante de tiempo efectiva (~12s de olvido)
    map_publish_period_s: 1.0
    tf_lookup_timeout_s: 0.2

    # --- PRECARGA DE PRIOR OSM (MAPA SEMILLA) ---
    seed_map_path: ""              # Vacío = sin precarga, comportamiento original sin cambios
    seed_confidence_scale: 0.3     # Fracción de confidence_max — confianza moderada, no máxima
    semantic_layer_enabled: true   # Habilita canal semántico estático independiente desacoplado del decaimiento
    semantic_override_threshold: 30.0 # 2.0 * hit_gain = 30.0 -> requiere 2 hits consecutivos antes de anular el prior semántico


