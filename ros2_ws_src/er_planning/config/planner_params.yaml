bev_planner_node:
  ros__parameters:
    # --------------------------------------------------------------------------
    # Tópicos ROS 2 y Operación
    # --------------------------------------------------------------------------
    image_topic: "earth_rover/front/image_raw"
    gps_topic: "gps/filtered"
    heading_topic: "earth_rover/heading"
    target_topic: "earth_rover/target_waypoint"
    planned_path_topic: "earth_rover/planned_path"
    visualization_topic: "earth_rover/planner_visualization"
    valid_topic: "earth_rover/planner_valid"
    local_bev_grid_topic: "earth_rover/local_bev_grid"
    alive_paths_topic: "earth_rover/alive_paths"
    publish_visualization: false

    # Integración y Guía por Planificador Global (Fase 4)
    global_path_topic: "earth_rover/global_path"
    global_planner_valid_topic: "earth_rover/global_planner_valid"
    use_global_path_guidance: true
    global_path_max_stale_s: 3.0
    global_lookahead_distance_m: 3.5
    map_frame: "map"
    base_frame: "base_link"
    tf_lookup_timeout_s: 0.2

    # Throttle del hilo de planificación (segundos mínimos entre iteraciones)
    planning_min_period_s: 0.1

    # Resolución del modelo SAM-TP / GeNIE
    # Vacío = auto-resolver (local -> SAMTP_CHECKPOINT -> cache -> Hugging Face)
    checkpoint_path: ""
    hf_repo: ""
    device: ""              # vacío = auto (cuda > cpu)
    contrast_refine: true

    # --------------------------------------------------------------------------
    # Calibración y Proyección a Vista de Pájaro (BEV) para Earth Rover Mini+
    # --------------------------------------------------------------------------
    # Altura del plano del suelo en el marco base_link (metros)
    ground_z: 0.0

    # Resolución espacial de la grilla local BEV (metros por píxel)
    resolution_m_per_px: 0.03

    # Rango hacia adelante representado en la grilla BEV local (metros)
    forward_range_m: 4.0

    # Semiancho lateral a izquierda y derecha del centro del rover (metros, ancho total = 2 * side_range)
    side_range_m: 2.0

    # Distancia máxima de proyección de rayos ópticos (metros)
    max_ray_distance_m: 6.0

    # Rutas opcionales a matrices .npy (si están vacías, se cargan de rover_traversability.calibration)
    camera_k_path: ""
    camera_t_base_camera_path: ""

    # --------------------------------------------------------------------------
    # Parámetros del Algoritmo de Planificación (GeNIE Path Bank)
    # --------------------------------------------------------------------------
    # Dimensión cuadrada de la grilla interna del planificador (píxeles)
    grid_size: 240

    # Costo asignado a celdas no observadas / desconocidas (0.0 libre a 1.0 intransitable)
    unknown_cost: 0.2

    # Kernel de suavizado gaussiano del mapa de costos
    smooth_kernel: 3

    # Cantidad de metas en los bordes de la grilla para generar el banco de caminos
    num_goals: 30

    # Cantidad de puntos intermedios muestreados por cada meta
    num_mid_points_per_goal: 20

    # Muestras por longitud de arco a lo largo de cada trayectoria (N puntos = path_num_samples + 1)
    path_num_samples: 100

    # Parámetros físicos del vehículo para derivación automática de footprint
    robot_length_m: 0.250
    robot_width_m: 0.190
    footprint_safety_margin: 1.05

    # Tamaño en píxeles de la huella (footprint) del vehículo en la grilla del planner (240x240)
    # Si footprint_px = 0, se deriva dinámicamente en código con D_circ = sqrt(L^2 + W^2) * margin
    footprint_px: 0

    # Umbral de costo de peligro a partir del cual una celda se considera colisión
    threshold_cost: 0.50

    # Fracción máxima de celdas en el footprint que pueden superar threshold_cost antes de descartar el camino
    threshold_points_ratio: 0.05

    # Cantidad de puntos iniciales del camino verificados por el filtro de colisión temprana
    number_of_points_to_filter: 60

    # Factor de escala exponencial (alpha) para aversión al riesgo en la integración del costo
    alpha: 1.0

    # Cantidad de mejores caminos (Top-K) usados para la fusión ponderada final
    best_k: 12

    # Agrupamiento adaptativo K-Means para seleccionar la rama orientada hacia la meta
    use_clustering: true
    max_clusters: 4
    cluster_angle_threshold_deg: 40.0

    # Semilla aleatoria para reproducibilidad del banco de trayectorias (null = no determinista)
    random_seed: 42

    # Inyección explícita del píxel de meta en el banco de caminos
    include_goal_in_path_bank: false
    include_random_goals: true
