  # Config del puente GeNIE <-> Earth Rovers SDK
# Earth Rover Mini+ — calibrado el 2026-07-31
#
# Calibracion propia de ESTE robot:
#   intrinsecos: 24/24 vistas, error de reproyeccion 0.42 px
#   pose:        error 0.67 px, altura 0.1502 m (regla: 0.15 m — coinciden)
#
# Si cambia IMAGE_QUALITY o IMAGE_FORMAT en el .env del SDK, o si le pegas un
# golpe a la camara, hay que recalibrar.

rover:
  base_url: "http://localhost:8000"
  timeout_s: 5.0

samtp:
  config_path: "sam2/configs/sam2.1_inference_tiny/sam2.1_custom2.yaml"
  checkpoint_path: "sam2_logs/configs/sam2.1_training_tiny/sam2_training_custom2_freezeNoneNone_f57.yaml/checkpoints/checkpoint_2.pt"  # viejo, checkpoint generico del paper
  #checkpoint_path: "checkpoints/checkpoint_finetuned_v2.pt"   # nuevo, fine-tuneado en 50k frames del Mini+
  device: null
  precision: "auto"
  score_thresh: 0.0
camera:
  calibrated: true

  image_size: [1920, 1080]

  intrinsics:
    - [925.265722853314, 0.0, 962.3052531643399]
    - [0.0, 924.6288195383473, 528.3891677741947]
    - [0.0, 0.0, 1.0]

  # k1 = -0.263: barril marcado, tipico de un gran angular de ~92 grados.
  # Corregirlo NO es opcional: project_score_to_bev asume pinhole puro.
  dist_coeffs: [-0.26257227523222204, 0.06503885855790396, -0.00031427372195389234, -0.0011895820486559178, -0.0073726075647136185]

  # Solo se usan si 'pose' es null. Se dejan como referencia.
  height_m: 0.150
  pitch_down_deg: 1.85

  # T_world_camera de pose_D (el de menor error). Tiene prioridad sobre
  # height_m y pitch_down_deg.
  pose:
    - [-0.000313571, -0.032360666, 0.999476207, 0.000000000]
    - [-0.999953056, 0.009689420, -0.000000000, 0.000000000]
    - [-0.009684345, -0.999429288, -0.032362186, 0.150244633]
    - [0.000000000, 0.000000000, 0.000000000, 1.000000000]

projection:
  ground_z: 0.0
  resolution_m_per_px: 0.03

  # PENDIENTE: con la camara a 15 cm, el suelo lejano se ve muy comprimido y
  # la mascara se vuelve poco confiable a partir de cierta distancia. Mirar el
  # BEV sobre una foto de vereda y bajar esto a 2.5-3.0 si hace falta.
  forward_range_m: 2.0
  side_range_m: 2.0
  max_ray_distance_m: 2.5
  projection_downscale: 2
navigation:
  # Determinar con tools/check_angular_sign.py:
  #   -1.0  si angular positivo hace girar a la IZQUIERDA
  #   +1.0  si angular positivo hace girar a la DERECHA
  angular_sign: -1.0

  max_linear: 1.0       # maximo de la escala -1..1 (NO m/s).
  max_angular: 0.45
  turn_speed: 0.40
  # Ganancia del giro: angular = kp_angular * radianes(error). Con 0.9 el
  # comando saturaba en max_angular apenas el error pasaba los 29 grados, y
  # como el planner devuelve tipicamente 40-70 grados, giraba SIEMPRE al
  # maximo: sobrepasaba, el error cambiaba de signo, giraba al maximo para el
  # otro lado -> el zigzag que se ve en la traza del mapa. Con 0.45 recien
  # satura a los 57 grados, asi que en el rango normal responde proporcional
  # al error en vez de a todo o nada.
  kp_angular: 0.45
  lookahead_m: 1.5
  align_threshold_deg: 90.0

  goal_range_m: 3.5
  claim_radius_m: 15.0    # tolerancia oficial del ERC

  # MEDIDO en la corrida debug/go6 (14 muestras con las dos fuentes leidas en
  # el mismo instante): el desacuerdo medio brujula-GPS es de -3 grados, o sea
  # que el magnetometro de ESTE robot NO tiene el offset que asumia el
  # comentario anterior. Y mientras el robot giraba ~110 grados horario, la
  # brujula (-27 -> +99) y el giroscopo de la odometria (-169 -> -272) lo
  # siguieron los dos; el track GPS se quedo clavado en ~26 grados.
  #
  # El problema es estructural del track GPS: _heading_from_track mide la
  # direccion desde la muestra mas vieja a la mas nueva, o sea una CUERDA del
  # arco, no la tangente. Girando, esa cuerda no dice hacia donde mira el
  # robot. Por eso ahora la fuente primaria es la brujula.
  heading_min_displacement_m: 1.5
  trust_orientation: true
  orientation_offset_deg: 0.0
  orientation_sign: 1.0
  commit_hold_s: 2.0
  commit_min_deg: 8.0
  commit_override_deg: 30.0

  # El planner geometrico (plan_on_bev) NO corre en cada frame: solo cuando
  # el robot avanzo esto desde el ultimo plan (medido sobre la pose de
  # odometry.py, ya corregida por GPS cuando hay fix), o antes si al camino
  # cacheado le queda menos de replan_min_remaining_m por delante. Entre
  # medio, el bridge sigue el ultimo camino calculado, reproyectado a la pose
  # actual (transform_path_xy en navigation.py) — asi el robot se sigue
  # moviendo en vez de quedarse "pensando" cada frame. Un obstaculo al frente
  # (front_is_blocked) sigue frenando de inmediato, cada frame, sin esperar
  # a que se cumpla esta distancia.
  replan_every_m: 1.0
  replan_min_remaining_m: 0.4
  # Red de seguridad temporal: replanificar igual si pasaron estos segundos
  # desde el ultimo plan, aunque no se haya cumplido el disparo por distancia
  # (p.ej. si la odometria se queda quieta por un hueco de telemetria).
  replan_max_s: 2.0

  # Velocidad lineal minima mientras se sigue un plan YA comprometido.
  # Es la perilla principal contra el patron avanza-frena-avanza: con un plan
  # elegido, un error de rumbo mayor a align_threshold_deg hace CURVAR a esta
  # velocidad en vez de pivotear en el lugar (linear=0, que es avance neto
  # cero). Subila si el rover todavia se frena de mas al corregir rumbo.
  min_linear_while_planned: 0.08
planner:
  grid_size: 240
  # Costo de una celda nunca observada. Una celda OBSERVADA cuesta
  # (1 - transitabilidad), asi que este numero define el break-even: con 0.2,
  # el piso observado necesitaba transitabilidad > 0.80 para que el planner lo
  # prefiriera sobre territorio que nunca vio -> tiraba hacia lo desconocido
  # teniendo verde al lado. Con 0.30 el break-even baja a 0.70.
  #
  # TECHO DURO: tiene que quedar por DEBAJO de threshold_cost (0.35). Si lo
  # iguala o lo supera, el filtro de caminos (path_selection.py) descarta todo
  # camino que cruce >2% de celdas desconocidas, y como ~67% del mapa esta sin
  # observar, se quedaria sin ningun camino valido.
  unknown_cost: 0.30
  smooth_kernel: 3
  num_goals: 30
  num_mid_points_per_goal: 20
  path_num_samples: 100
  footprint_px: 12        # ~0.30 m de ancho de robot. Medir el Mini y ajustar.
  threshold_cost: 0.35
  threshold_points_ratio: 0.02
  number_of_points_to_filter: 60
  alpha: 1.0
  best_k: 12
  use_clustering: true    # el path fusion del paper
  max_clusters: 2
  cluster_angle_threshold_deg: 40.0
  random_seed: 42
  include_goal_in_path_bank: false
  include_random_goals: true

  # Peso del termino "terminar cerca de la meta" en el costo de cada camino.
  # Con 0.0 (el comportamiento original) el costo SOLO mide transitabilidad:
  # en una explanada libre todos los caminos empatan, la direccion elegida es
  # arbitraria, y el robot describe circulos sin acercarse al checkpoint.
  # Medido sobre el BEV real de debug/go3, pidiendo metas de -45 a +45 grados:
  #   0.0 -> el planner devuelve solo -20 o +43, ignora la meta
  #   1.0 -> respuesta monotona (-34 -22 -15 -11 +19 +24 +24), signo correcto
  # Sigue subvirando porque el banco de caminos tiene destinos ALEATORIOS y no
  # existen candidatos hacia cualquier direccion: eso se arregla aparte.
  goal_weight: 1.0

safety:
  stale_frame_s: 2.0
  max_consecutive_errors: 5
  recovery_after_empty_plans: 3
  recovery_turn_s: 1.5
  loop_period_s: 0.2
  max_consecutive_turns: 4
  unstick_forward_s: 2.5
  use_vlm_recovery: true
  vlm_recovery_timeout_s: 4.0
  vlm_recovery_min_confidence: 0.35

  # Obstaculo persistente: cuantos frames SEGUIDOS de "OBSTACULO al frente"
  # antes de evaluar un retroceso (no reaccionar a un bloqueo de un solo
  # frame, p.ej. alguien que cruzo caminando).
  obstacle_persist_frames: 4
  # Umbrales sobre lo que dice la MEMORIA (PersistentMap, no una camara
  # trasera real) del rumbo "atras" para animarse a retroceder.
  retroceso_min_libre_pct: 55.0
  retroceso_min_cobertura_pct: 30.0
  retroceso_max_m: 0.6
  retroceso_paso_m: 0.2
  # Negativo = reversa. Sin verificar empiricamente todavia (no hay un
  # tools/ equivalente a check_angular_sign.py para esto) — confirmalo a
  # mano la primera vez, con espacio de sobra detras del robot.
  retroceso_linear: -0.18

  # Recuperacion informada por memoria: rumbos candidatos (grados relativos
  # al actual) que _recover() evalua con el mapa antes de girar. 0=adelante
  # (por si el bloqueo ya se disolvio), 180=atras.
  # Giro de recuperacion (el "girando hacia +180 grados"). Antes tardaba ~8 s
  # en dar media vuelta: usaba turn_speed (0.40) como si fuera rad/s, y son
  # unidades distintas -- turn_speed es un comando normalizado en -1..1.
  #   recovery_turn_speed : comando angular durante el giro
  #   recovery_step_deg   : cuanto gira entre verificacion y verificacion
  #                         (pasos mas grandes = menos pausas = mas rapido)
  #   recovery_deg_per_s  : tasa REAL de giro del robot, en grados por segundo.
  #                         Es lo que fija la duracion de cada paso. Medila
  #                         cronometrando media vuelta: si el robot se pasa,
  #                         subila; si se queda corto, bajala.
  # Con estos valores media vuelta son 4 pasos de 1 s en vez de 9 de 0.87 s.
  recovery_turn_speed: 0.45
  recovery_step_deg: 45.0
  recovery_deg_per_s: 45.0
  recovery_headings_deg: [0.0, 90.0, -90.0, 180.0]
  recovery_min_cobertura_pct: 25.0
  # Radio de la ventana del mapa persistente que se consulta por cada rumbo
  # candidato. Muy grande diluye obstaculos chicos en el promedio y todo sale
  # "libre"; muy chico decide con poquisimas celdas.
  heading_search_radius_m: 2.0


odometry:
  wheel_radius_m: 0.0527
  track_width_m: 0.15
  left_rpm_indices: [0, 2]
  right_rpm_indices: [1, 3]
  # El firmware del Mini invierte la convencion diferencial estandar:
  # rueda izquierda adelante + derecha atras = giro a la IZQUIERDA.
  # Verificado con el control manual el 2026-08-01.
  rotation_sign:  1.0
  use_gyro_for_rotation: true
  gps_correction: true
  min_gps_displacement_m: 1.0

memory:
  enabled: true
  map_size_m: 8.0
  update_weight: 0.45
  decay_per_s: 0.08
  recenter_margin_m: 1.5
  min_confidence: 0.15
  plan_forward_m: 3.0
  plan_side_m: 2.0
