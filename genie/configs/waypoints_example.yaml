# Ejemplo de ruta para mission.search_mode: "waypoints" (Opcion A del doc:
# mapa conocido).
#
# Los puntos son (x_m, y_m) en el marco de ODOMETRIA: el origen es donde
# estaba el rover cuando arranco indoor_bridge.py (x adelante, y izquierda,
# ver odometry.py). NO son coordenadas GPS ni coordenadas del edificio.
#
# Como armar esta lista para tu recorrido real:
#   1. Pone el rover exactamente donde va a arrancar la mision.
#   2. Recorre el trayecto a mano (joystick/teleop) una vez, guardando
#      pose de la odometria en cada tramo (tools/diag_odometry.py imprime
#      la pose en vivo — anota x,y en cada esquina/puerta).
#   3. Cargá esos puntos aca, en orden. IndoorBridge los va siguiendo con
#      WaypointRoute: cuando esta a waypoint_reach_radius_m o menos del
#      punto actual, pasa al siguiente. Si en el medio ve el cono, la
#      maquina de estados (mission.py) deja de mirar la lista y va directo
#      al cono — la ruta es un "mientras tanto", no una obligacion.
#
# Este archivo es solo un ejemplo ilustrativo (un pasillo recto, doblar a la
# derecha, otro tramo recto) — reemplazalo por las medidas reales de tu
# edificio antes de usarlo.

waypoints:
  - {x_m: 4.0, y_m: 0.0}     # tramo recto del pasillo 1
  - {x_m: 6.0, y_m: -3.0}    # dobla a la derecha hacia el pasillo 2
  - {x_m: 6.0, y_m: -7.0}    # sigue derecho por el pasillo 2
