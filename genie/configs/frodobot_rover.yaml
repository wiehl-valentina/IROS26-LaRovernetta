  # Config del puente GeNIE <-> Earth Rovers SDK
# Earth Rover Mini+ — calibrado el 2026-07-31
#
# Calibracion propia de ESTE robot:
#   intrinsecos: 24/24 vistas, error de reproyeccion 0.42 px
#   pose:        error 0.67 px, altura 0.1502 m (regla: 0.15 m — coinciden)
#
# Si cambia IMAGE_QUALITY o IMAGE_FORMAT en el .env del SDK, o si le pegas un
# golpe a la camara, hay que recalibrar.

rover:
  base_url: "http://localhost:8000"
  timeout_s: 5.0

samtp:
  config_path: "sam2/configs/sam2.1_inference_tiny/sam2.1_custom2.yaml"
  checkpoint_path: "sam2_logs/configs/sam2.1_training_tiny/sam2_training_custom2_freezeNoneNone_f57.yaml/checkpoints/checkpoint_2.pt"  # viejo, checkpoint generico del paper
  #checkpoint_path: "checkpoints/checkpoint_finetuned_v2.pt"   # nuevo, fine-tuneado en 50k frames del Mini+
  device: null
  precision: "auto"
  score_thresh: 0.0
camera:
  calibrated: true

  image_size: [1920, 1080]

  intrinsics:
    - [925.265722853314, 0.0, 962.3052531643399]
    - [0.0, 924.6288195383473, 528.3891677741947]
    - [0.0, 0.0, 1.0]

  # k1 = -0.263: barril marcado, tipico de un gran angular de ~92 grados.
  # Corregirlo NO es opcional: project_score_to_bev asume pinhole puro.
  dist_coeffs: [-0.26257227523222204, 0.06503885855790396, -0.00031427372195389234, -0.0011895820486559178, -0.0073726075647136185]

  # Solo se usan si 'pose' es null. Se dejan como referencia.
  height_m: 0.150
  pitch_down_deg: 1.85

  # T_world_camera de pose_D (el de menor error). Tiene prioridad sobre
  # height_m y pitch_down_deg.
  pose:
    - [-0.000313571, -0.032360666, 0.999476207, 0.000000000]
    - [-0.999953056, 0.009689420, -0.000000000, 0.000000000]
    - [-0.009684345, -0.999429288, -0.032362186, 0.150244633]
    - [0.000000000, 0.000000000, 0.000000000, 1.000000000]

projection:
  ground_z: 0.0
  resolution_m_per_px: 0.03

  # PENDIENTE: con la camara a 15 cm, el suelo lejano se ve muy comprimido y
  # la mascara se vuelve poco confiable a partir de cierta distancia. Mirar el
  # BEV sobre una foto de vereda y bajar esto a 2.5-3.0 si hace falta.
  forward_range_m: 2.0
  side_range_m: 2.0
  max_ray_distance_m: 2.5
  projection_downscale: 2
navigation:
  # Determinar con tools/check_angular_sign.py:
  #   -1.0  si angular positivo hace girar a la IZQUIERDA
  #   +1.0  si angular positivo hace girar a la DERECHA
  angular_sign: -1.0

  max_linear: 1.0       # maximo de la escala -1..1 (NO m/s).
  max_angular: 0.45
  turn_speed: 0.40
  # Ganancia del giro: angular = kp_angular * radianes(error). Con 0.9 el
  # comando saturaba en max_angular apenas el error pasaba los 29 grados, y
  # como el planner devuelve tipicamente 40-70 grados, giraba SIEMPRE al
  # maximo: sobrepasaba, el error cambiaba de signo, giraba al maximo para el
  # otro lado -> el zigzag que se ve en la traza del mapa. Con 0.45 recien
  # satura a los 57 grados, asi que en el rango normal responde proporcional
  # al error en vez de a todo o nada.
  kp_angular: 0.45
  # 1.5 m en un corredor angosto apunta PASADO la curva: el punto de
  # lookahead cae del otro lado del pasto y el follower corta el codo contra
  # el borde. 1.0 m sigue siendo mas largo que el frenado y no zigzaguea.
  lookahead_m: 1.0
  align_threshold_deg: 90.0

  goal_range_m: 3.5
  claim_radius_m: 15.0    # tolerancia oficial del ERC

  # MEDIDO en la corrida debug/go6 (14 muestras con las dos fuentes leidas en
  # el mismo instante): el desacuerdo medio brujula-GPS es de -3 grados, o sea
  # que el magnetometro de ESTE robot NO tiene el offset que asumia el
  # comentario anterior. Y mientras el robot giraba ~110 grados horario, la
  # brujula (-27 -> +99) y el giroscopo de la odometria (-169 -> -272) lo
  # siguieron los dos; el track GPS se quedo clavado en ~26 grados.
  #
  # El problema es estructural del track GPS: _heading_from_track mide la
  # direccion desde la muestra mas vieja a la mas nueva, o sea una CUERDA del
  # arco, no la tangente. Girando, esa cuerda no dice hacia donde mira el
  # robot. Por eso ahora la fuente primaria es la brujula.
  heading_min_displacement_m: 1.5
  trust_orientation: true
  orientation_offset_deg: 0.0
  orientation_sign: 1.0
  commit_hold_s: 2.0
  commit_min_deg: 8.0
  commit_override_deg: 30.0

  # El planner geometrico (plan_on_bev) NO corre en cada frame: solo cuando
  # el robot avanzo esto desde el ultimo plan (medido sobre la pose de
  # odometry.py, ya corregida por GPS cuando hay fix), o antes si al camino
  # cacheado le queda menos de replan_min_remaining_m por delante. Entre
  # medio, el bridge sigue el ultimo camino calculado, reproyectado a la pose
  # actual (transform_path_xy en navigation.py) — asi el robot se sigue
  # moviendo en vez de quedarse "pensando" cada frame. El chequeo frontal
  # (front_guard, ver safety.front) sigue corriendo cada frame, sin esperar
  # a que se cumpla esta distancia.
  #
  # 0.6 en vez de 1.0: en un corredor de pasto que dobla, el camino cacheado
  # se desactualiza mucho mas rapido que en una vereda recta. El recorte del
  # bridge (trim_path_xy) cubre el hueco, pero replanificar antes es mejor
  # que recortar seguido -- si ves que el planner tarda y baja el Hz del
  # bucle, subilo de vuelta a 0.8.
  replan_every_m: 0.6
  replan_min_remaining_m: 0.4
  # Red de seguridad temporal: replanificar igual si pasaron estos segundos
  # desde el ultimo plan, aunque no se haya cumplido el disparo por distancia
  # (p.ej. si la odometria se queda quieta por un hueco de telemetria).
  replan_max_s: 2.0

  # Velocidad lineal minima mientras se sigue un plan YA comprometido.
  # Es la perilla principal contra el patron avanza-frena-avanza: con un plan
  # elegido, un error de rumbo mayor a align_threshold_deg hace CURVAR a esta
  # velocidad en vez de pivotear en el lugar (linear=0, que es avance neto
  # cero). Subila si el rover todavia se frena de mas al corregir rumbo.
  #
  # 0.12 para Mexico: con 0.08 y el pasto pisado el rover manda el comando
  # pero no vence la friccion -- "avanza" sin moverse, y la odometria de
  # ruedas lo cuenta igual. Ojo que safety.front.min_speed_scale multiplica
  # ESTE valor cuando el guard esta en SLOW (0.12 * 0.35 = 0.042); si en el
  # dry-run ves comandos que no mueven al robot, subi min_speed_scale antes
  # que este numero.
  min_linear_while_planned: 0.12
planner:
  grid_size: 240
  # Costo de una celda nunca observada. Una celda OBSERVADA cuesta
  # (1 - transitabilidad), asi que este numero define el break-even: con 0.2,
  # el piso observado necesitaba transitabilidad > 0.80 para que el planner lo
  # prefiriera sobre territorio que nunca vio -> tiraba hacia lo desconocido
  # teniendo verde al lado. Con 0.30 el break-even baja a 0.70.
  #
  # TECHO DURO: tiene que quedar por DEBAJO de threshold_cost (0.35). Si lo
  # iguala o lo supera, el filtro de caminos (path_selection.py) descarta todo
  # camino que cruce >2% de celdas desconocidas, y como ~67% del mapa esta sin
  # observar, se quedaria sin ningun camino valido.
  # SUBIDO de 0.30 a 0.45 para Mexico. El break-even es: una celda OBSERVADA
  # cuesta (1 - transitabilidad), asi que con 0.30 el planner prefiere
  # territorio que NUNCA vio antes que una senda de tierra con transitabilidad
  # 0.55 (que cuesta 0.45). En el pasto mexicano SAM-TP saca justamente
  # 0.4-0.6 en el camino bueno, asi que el planner se iba a lo desconocido
  # teniendo la senda al lado. Con 0.45 el break-even baja a trav > 0.55.
  #
  # TECHO DURO: tiene que quedar por DEBAJO de threshold_cost. Si lo iguala,
  # el filtro descarta todo camino que cruce celdas desconocidas y, como la
  # mayor parte del mapa nunca se observo, no queda ningun camino valido.
  unknown_cost: 0.45
  smooth_kernel: 3
  num_goals: 30
  num_mid_points_per_goal: 20
  path_num_samples: 100
  # FOOTPRINT EN METROS (nuevo). footprint_px es fragil: un pixel del planner
  # NO mide lo mismo a lo largo que a lo ancho, porque el BEV no es cuadrado y
  # plan_on_bev lo reescala a un grid cuadrado. Con estas claves en metros,
  # planner.py hace la conversion con la escala LATERAL real (que es la que
  # decide si pasas por un hueco). Correr tools/check_bev_scales.py para ver
  # a cuantos px equivalen con esta config.
  #
  # La separacion entre los dos es lo que deja pasar por corredores angostos
  # SIN dejar de centrarse:
  #   footprint_veto_m = ancho REAL del rover -> es lo unico que puede vetar
  #                      un camino. Si el hueco entra, pasa.
  #   footprint_m      = ancho + margen -> solo entra en el COSTO, asi que
  #                      empuja al camino al medio del verde sin prohibir
  #                      nada. Junto con center_weight es "centrarse en lo
  #                      verde aunque tenga muy poco ancho".
  footprint_m: 0.50
  footprint_veto_m: 0.30    # MEDIR el Mini con una cinta y poner el numero real
  footprint_px: 12          # solo se usa si footprint_m es null

  # SUBIDO de 0.35 a 0.60, y es probablemente el cambio mas importante de
  # todos. El costo de una celda es (1 - transitabilidad), asi que 0.35 vetaba
  # toda celda con transitabilidad <= 0.65: en Mexico eso incluye la senda
  # entera, que SAM-TP saca en 0.4-0.6. El planner no se quedaba sin caminos
  # por el pasto, se quedaba sin caminos por el CAMINO. Con 0.60 se veta
  # trav <= 0.40, que es pasto de verdad.
  #
  # Verificalo en tu propio dato antes de creerme: en el panel de
  # 2c_evaluar_perception_bev.py, mira que valor tiene el BEV sobre la senda.
  # Si tu checkpoint nuevo la saca en 0.8+, bajalo de vuelta a 0.45-0.50.
  threshold_cost: 0.60
  # 0.02 = 4 celdas de 169 alcanzaban para vetar un camino entero. En pasto
  # con bordes difusos eso pasa en todos los caminos del banco a la vez ->
  # filtered_paths vacio -> plan vacio -> recuperacion. 0.06 (~10 celdas)
  # tolera el borde sin tolerar un obstaculo real, que ocupa el footprint
  # entero, no el 6%.
  threshold_points_ratio: 0.06
  number_of_points_to_filter: 60
  alpha: 1.0
  # 12 en un corredor angosto promedia caminos de los DOS lados del pasto y
  # puede devolver uno que pasa por el medio del pasto (la mezcla de
  # costs.pick_final_path es un promedio ponderado, no una eleccion). 6 deja
  # la mezcla dentro de un mismo lado.
  best_k: 6
  use_clustering: true    # el path fusion del paper
  max_clusters: 2
  cluster_angle_threshold_deg: 40.0
  random_seed: 42
  include_goal_in_path_bank: false
  include_random_goals: true

  # Peso del termino "terminar cerca de la meta" en el costo de cada camino.
  # Con 0.0 (el comportamiento original) el costo SOLO mide transitabilidad:
  # en una explanada libre todos los caminos empatan, la direccion elegida es
  # arbitraria, y el robot describe circulos sin acercarse al checkpoint.
  # Medido sobre el BEV real de debug/go3, pidiendo metas de -45 a +45 grados:
  #   0.0 -> el planner devuelve solo -20 o +43, ignora la meta
  #   1.0 -> respuesta monotona (-34 -22 -15 -11 +19 +24 +24), signo correcto
  # Sigue subvirando porque el banco de caminos tiene destinos ALEATORIOS y no
  # existen candidatos hacia cualquier direccion: eso se arregla aparte.
  goal_weight: 1.0

  # ---- corredores angostos (genie_path_planner/narrow.py) ---------------
  # Centrado: penaliza la ASIMETRIA lateral (cuanto verde hay a izquierda vs
  # a derecha en la misma fila), no la angostura. Un corredor de 0.35 m no
  # paga nada por ser angosto; solo se pide ir por su eje.
  #   0.0  -> desactivado (comportamiento anterior exacto)
  #   0.18 -> punto de partida
  #   >0.3 -> empieza a competir con goal_weight y el rover deja de doblar
  #           hacia el checkpoint. No subirlo sin mirar el debug.
  center_weight: 0.18
  # Hasta donde se busca el borde del corredor, en PIXELES DEL PLANNER. Si de
  # un lado no hay pasto/pared dentro de esta distancia, no se considera
  # corredor y la penalizacion es exactamente 0 (asi el campo abierto se
  # comporta igual que antes). Con esta config son 2.5 cm por px, o sea que
  # 24 px son 0.60 m por lado: se centra en corredores de hasta ~1.2 m de
  # ancho total y no toca nada mas ancho que eso.
  # tools/check_bev_scales.py imprime la conversion con TU config.
  center_max_useful_px: 24

  # Filtro por prefijo: en vez de descartar el camino entero apenas toca
  # rojo, se mide cuantos METROS limpios tiene ANTES del primer punto malo y
  # se conservan los que superen min_prefix_m. Esto es "el camino verde sirve
  # aunque al final tenga un poco de rojo".
  # Si con min_prefix_m no sobrevive ninguno se reintenta con el 60%
  # (prefix_relax_ratio) y despues con hard_min_prefix_m; si tampoco, se
  # queda con los de prefijo mas largo. NUNCA devuelve lista vacia si algun
  # camino avanza algo -- frenar es tarea de safety.front, no del planner.
  min_prefix_m: 1.0
  prefix_relax_ratio: 0.6
  hard_min_prefix_m: 0.25

safety:
  stale_frame_s: 2.0
  max_consecutive_errors: 5
  recovery_after_empty_plans: 3
  recovery_turn_s: 1.5
  loop_period_s: 0.2

  # Régimen cercano. Cuenta ENCIMA de front.persist_frames, y ahora además
  # exige que el rover no haya avanzado 0.10 m. Con 2 entraba 48 veces en 216
  # iteraciones.
  obstacle_persist_frames: 4

  front:
    # near_m se deriva de camera.* si no lo ponés acá. Con la calibración
    # actual del Mini da ~0.37 m. Ponelo a mano sólo si medís otra cosa.
    # near_m: 0.40
    half_width_m: 0.22        # 0.30/2 + 0.07 de margen
    stop_m: 0.50
    clear_m: 1.40
    traversable_thresh: 0.30
    min_free_ratio: 0.55
    blocked_rows_needed: 2
    persist_frames: 3
    release_frames: 2
    min_speed_scale: 0.35
    unknown_is_free: true

  escape:
    prior_free: 0.15          # cuánto vale "no sé" en fracción libre
    prior_weight: 0.30
    unblock_free: 0.35
    repeat_penalty: 0.12
    repeat_memory: 4
    goal_bonus: 0.06
    min_score: 0.10

  turn:
    tolerance_deg: 15.0
    angular_start: 0.50
    angular_max: 1.00         # subilo si el rover sigue sin rotar en pasto
    angular_step: 0.15
    stall_ticks: 2
    stall_deg: 3.0
    max_ticks: 40
    arc_min_clearance_m: 0.55
    arc_linear: 0.12
    tick_s: 0.35

  # Estos siguen usándose para el retroceso.
  retroceso_min_libre_pct: 55.0
  retroceso_min_cobertura_pct: 30.0
  retroceso_max_m: 0.6
  retroceso_paso_m: 0.2
  retroceso_linear: -0.18

  # Ya NO se usan: el giro es a lazo cerrado.
  #   recovery_turn_speed / recovery_step_deg / recovery_deg_per_s
  recovery_headings_deg: [0.0, 90.0, -90.0, 180.0]
  recovery_min_cobertura_pct: 25.0
  heading_search_radius_m: 2.0

memory:
  enabled: true
  map_size_m: 8.0
  update_weight: 0.45
  decay_per_s: 0.08
  recenter_margin_m: 1.5
  min_confidence: 0.15
  # OJO, ver tools/check_bev_scales.py antes de tocar esto.
  # plan_on_bev recibe UN solo bev_resolution_m, pero extract_bev recorta
  # plan_forward_m de largo y 2*plan_side_m de ancho sobre una grilla con el
  # mismo alto y ancho que el BEV de percepcion. Si plan_forward_m y
  # plan_side_m no guardan la misma proporcion que ese alto/ancho, un pixel
  # mide distinto a lo largo que a lo ancho y el planner no se entera: las
  # distancias hacia adelante (y con ellas la meta y el largo de los caminos)
  # quedan escaladas mal.
  #
  # Con el BEV de percepcion de esta config (alto = forward_range/res, ancho
  # = 2*side_range/res, o sea ancho = 2*alto), la condicion es
  # plan_forward_m == plan_side_m. Por eso 3.0 y 3.0 en vez de 3.0 y 2.0.
  # El script de arriba te imprime la proporcion real y te avisa si no da.
  plan_forward_m: 3.0
  plan_side_m: 3.0
