# Config de la Mision Semantica Indoor (VLM + BEV Corridor).
#
# UNICA mision del bridge indoor: ya no existe la deteccion de conos, asi que
# este archivo no tiene seccion `cone:` ni `mission.cone_photo`. Conserva
# intacta la calibracion del robot (camera, projection, samtp, navigation,
# planner, safety, memory, odometry).
#
# El circuito vive ACA, no en mission.py: cambiar el recorrido es editar la
# lista `mission.segments`. Los prompts son literalmente lo que se le manda
# al VLM.

rover:
  base_url: "http://localhost:8000"
  timeout_s: 5.0

samtp:
  config_path: "sam2/configs/sam2.1_inference_tiny/sam2.1_custom2.yaml"
  checkpoint_path: "sam2_logs/configs/sam2.1_training_tiny/sam2_training_custom2_freezeNoneNone_f57.yaml/checkpoints/checkpoint_2.pt"
  device: null
  precision: "auto"
  score_thresh: 0.0

camera:
  calibrated: true
  image_size: [1920, 1080]
  intrinsics:
    - [925.265722853314, 0.0, 962.3052531643399]
    - [0.0, 924.6288195383473, 528.3891677741947]
    - [0.0, 0.0, 1.0]
  dist_coeffs: [-0.26257227523222204, 0.06503885855790396, -0.00031427372195389234, -0.0011895820486559178, -0.0073726075647136185]
  height_m: 0.150
  pitch_down_deg: 1.85
  pose:
    - [-0.000313571, -0.032360666, 0.999476207, 0.000000000]
    - [-0.999953056, 0.009689420, -0.000000000, 0.000000000]
    - [-0.009684345, -0.999429288, -0.032362186, 0.150244633]
    - [0.000000000, 0.000000000, 0.000000000, 1.000000000]

projection:
  ground_z: 0.0
  resolution_m_per_px: 0.03
  forward_range_m: 2.0
  side_range_m: 2.0
  max_ray_distance_m: 2.5
  projection_downscale: 2

navigation:
  angular_sign: -1.0
  max_linear: 0.9
  max_angular: 0.6
  turn_speed: 0.40
  kp_angular: 0.45
  lookahead_m: 1.5
  align_threshold_deg: 90.0
  commit_hold_s: 2.0
  commit_min_deg: 8.0
  commit_override_deg: 30.0
  replan_every_m: 0.6
  replan_min_remaining_m: 0.3
  replan_max_s: 1.5
  min_linear_while_planned: 0.06
  goal_range_m: 3.5
  claim_radius_m: 8.0
  heading_min_displacement_m: 1.5
  trust_orientation: false
  orientation_offset_deg: 0.0
  orientation_sign: 1.0

planner:
  grid_size: 200
  unknown_cost: 0.30
  smooth_kernel: 3
  num_goals: 24
  num_mid_points_per_goal: 16
  path_num_samples: 80
  footprint_px: 12
  threshold_cost: 0.35
  threshold_points_ratio: 0.02
  number_of_points_to_filter: 60
  alpha: 1.0
  best_k: 10
  use_clustering: true
  max_clusters: 2
  cluster_angle_threshold_deg: 40.0
  random_seed: 42
  include_goal_in_path_bank: false
  include_random_goals: true
  goal_weight: 1.0
  uniform_path_bank: true
  fan_max_angle_deg: 75.0
  fan_num_headings: 31

safety:
  stale_frame_s: 2.0
  max_consecutive_errors: 5
  recovery_after_empty_plans: 3
  recovery_turn_s: 1.2
  loop_period_s: 0.2
  max_consecutive_turns: 5
  unstick_forward_s: 1.5
  obstacle_persist_frames: 4
  retroceso_min_libre_pct: 55.0
  retroceso_min_cobertura_pct: 30.0
  retroceso_max_m: 0.35
  retroceso_paso_m: 0.12
  retroceso_linear: -0.15
  recovery_headings_deg: [90.0, -90.0, 180.0]
  recovery_min_cobertura_pct: 25.0
  recovery_turn_speed: 0.45
  recovery_step_deg: 45.0
  recovery_deg_per_s: 45.0
  heading_search_radius_m: 2.0
  use_vlm_recovery: false
  vlm_recovery_timeout_s: 4.0
  vlm_recovery_min_confidence: 0.35

odometry:
  wheel_radius_m: 0.0527
  track_width_m: 0.15
  left_rpm_indices: [0, 2]
  right_rpm_indices: [1, 3]
  rotation_sign: 1.0
  use_gyro_for_rotation: true
  gps_correction: false
  min_gps_displacement_m: 1.0

mapping:
  rtabmap_correction:
    enabled: true
    map_frame: "map"
    base_frame: "base_link"
    lookup_timeout_s: 0.2

memory:
  enabled: true
  map_size_m: 8.0
  update_weight: 0.45
  decay_per_s: 0.06
  recenter_margin_m: 1.5
  min_confidence: 0.15
  plan_forward_m: 3.0
  plan_side_m: 2.0

mission:
  segment_lookahead_m: 2.5
  corridor_centering_weight: 0.6
  corridor_centering_max_m: 0.8
  turn_probe_m: 1.2
  turn_max_deg: 150.0
  align_min_clearance_m: 1.5
  align_tolerance_deg: 8.0
  align_linear_scale: 0.25
  align_max_s: 12.0
  sweep_max_deg: 60.0
  bev_row0_is_far: true
  milestone_cooldown_s: 3.0
  vlm_stale_s: 2.5
  route_hint:
    enabled: false
    path: "configs/waypoints_sesion1.yaml"
    heading_bias_max_deg: 25
  segments:
    - id: "f1_entrada"
      milestone:
        id: "piano"
        prompt: "En la imagen de la camara frontal de un robot que avanza por un pasillo universitario: ¿se ve un piano (vertical o de cola)?"
        confirm_hits: 3
        min_confidence: 0.6
        max_distance_m: 6.0
      on_milestone:
        side: "left"
        look_for: "una puerta o vano de entrada abierto hacia la izquierda"
      max_distance_m: 25.0
      on_timeout: "sweep"
    - id: "f2_pasillo_central"
      milestone:
        id: "tres_sillas"
        prompt: "¿Se ven tres sillas alineadas en hilera contra una pared?"
        confirm_hits: 3
        min_confidence: 0.6
        max_distance_m: 6.0
      on_milestone:
        side: "left"
        look_for: "una apertura o pasillo lateral hacia la izquierda"
      max_distance_m: 30.0
      on_timeout: "sweep"
    - id: "f3_pasillo_final"
      milestone:
        id: "marca_azul"
        prompt: "¿Se ve una tuerca o pieza metalica AZUL sobre la pared, un mueble o el piso? Responde 'presente' solo si distinguis claramente el objeto azul, no si solo hay algo azulado de fondo."
        confirm_hits: 3
        min_confidence: 0.65
        max_distance_m: 3.0
      on_milestone:
        side: "left"
        look_for: "la continuacion del pasillo hacia la izquierda"
      max_distance_m: 30.0
      on_timeout: "advance"
    - id: "f4_retorno"
      milestone:
        id: "fin_pasillo"
        prompt: "¿El pasillo termina en una pared frontal a menos de 3 metros?"
        confirm_hits: 2
        min_confidence: 0.6
      on_milestone:
        side: "right"
        look_for: "la salida del pasillo / el vano por el que se vuelve"
      max_distance_m: 30.0
      on_timeout: "stop"
      final: true
vlm:
  # Unico backend: Gemini (REST directo). "off" lo apaga y cada tramo termina
  # por su fail-safe de distancia (segments[].on_timeout).
  backend: "gemini"

  # gemini-2.0-flash | gemini-2.5-flash | gemini-2.5-flash-lite.
  # OJO: los gemini-1.5-* estan retirados de la API publica -> 404.
  model: "gemini-3.1-flash-lite"

  # API key de Google AI Studio (empieza con "AIza"). Dejala VACIA aca y
  # exporta GEMINI_API_KEY en el entorno si el config va a git.
  api_key: ""               # usar GEMINI_API_KEY del entorno / .env

  # --- cuanto se le puede preguntar ---------------------------------------
  # Tope duro de la cuota de Gemini Flash (free tier): 15 pedidos por minuto,
  # en ventana deslizante de 60 s. Al llegar al tope el frame se saltea.
  max_rpm: 15

  interval_s: 2.0            # piso de tiempo entre consultas (antes 1.0: la respuesta tarda 3-6 s)
  interval_turn_s: 1.0       # piso mas corto en giros (antes 0.5)

  # Disparo por MOVIMIENTO (medido sobre la pose de odometry/RTAB-Map): una
  # consulta nueva necesita ademas medio metro de avance O 20 grados de giro
  # desde la anterior. El OR importa: en el giro el robot pivotea sin avanzar.
  # Un cambio de hito/tramo dispara siempre, sin esperar a moverse.
  query_every_m: 0.5
  query_every_deg: 20.0
  query_max_s: 8.0           # red de seguridad si el robot queda quieto

  timeout_s: 20.0           # antes 6.0: p95 medido = 6.1 s, cortaba justo ahi
  max_side_px: 512           # antes 640: menos bytes, respuesta mas rapida
  jpeg_quality: 70           # antes 80
  max_tokens: 128
  temperature: 0.0

  # --- para ver que esta haciendo -----------------------------------------
  check_on_start: true       # llamada de prueba al arrancar (credencial+modelo)
  log: true                  # una linea por respuesta: veredicto, confianza, latencia
  log_dir: "debug/vlm"       # guarda el jpg mandado y el json contestado de cada consulta
                             # (null para no guardar nada)

dashboard:
  route_status_path: "/home/pablolube/IROS26-LaRovernetta/earth-rovers-sdk/static/genie_waypoints.json"

